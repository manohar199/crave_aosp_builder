name: File Downloader & Telegram Uploader Menu

on:
  workflow_dispatch:
    inputs:
      gdrive_url:
        description: 'Enter Google Drive URL or File ID (MUST be public!)'
        required: true
        default: '15Ki1eA9IKuoS1V24Y9NuqACkvDrQO-JI'
      gofile_url:
        description: 'Enter Gofile URL'
        required: true
        default: 'https://gofile.io/d/MXMoqn'

jobs:
  process-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests telethon gdown 

    - name: Process Downloads and Upload to Telegram
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        GDRIVE_INPUT_URL: ${{ github.event.inputs.gdrive_url }}
        GOFILE_INPUT_URL: ${{ github.event.inputs.gofile_url }}
      run: |
        cat << 'EOF' > run_task.py
        import os
        import re
        import asyncio
        import requests
        import gdown
        from telethon import TelegramClient

        gdrive_raw = os.environ.get('GDRIVE_INPUT_URL', '').strip()
        gofile_raw = os.environ.get('GOFILE_INPUT_URL', '').strip()

        # --- 1. GDRIVE PARSING ---
        gdrive_id_match = re.search(r'(?:id=|/d/|/file/d/)([^/&#?]+)', gdrive_raw)
        gdrive_file_id = gdrive_id_match.group(1) if gdrive_id_match else gdrive_raw

        # --- 2. GOFILE API WITH GUEST TOKEN ---
        gofile_download_url = None
        gofile_id_match = re.search(r'/d/([A-Za-z0-9]+)', gofile_raw)
        
        if gofile_id_match:
            content_id = gofile_id_match.group(1)
            try:
                print("Fetching Gofile Guest Token...")
                token_req = requests.post("https://api.gofile.io/accounts").json()
                guest_token = token_req.get("data", {}).get("token")
                
                if guest_token:
                    headers = {"Authorization": f"Bearer {guest_token}"}
                    api_res = requests.get(f"https://api.gofile.io/contents/{content_id}", headers=headers).json()
                    
                    if api_res.get("status") == "ok":
                        children = api_res.get("data", {}).get("children", {})
                        if children:
                            first_file_id = list(children.keys())[0]
                            gofile_download_url = children[first_file_id].get("link")
            except Exception as e:
                print(f"Failed parsing Gofile link via API: {e}")

        # --- 3. SECURE DOWNLOAD ENGINE ---
        print("\n=== Starting Google Drive Download ===")
        try:
            gdown.download(id=gdrive_file_id, output="gdrive_file.zip", quiet=False, fuzzy=True)
        except Exception as e:
            print(f"GDrive download failed: {e}")

        print("\n=== Starting Gofile Download ===")
        if gofile_download_url:
            try:
                with requests.get(gofile_download_url, stream=True, allow_redirects=True) as r:
                    r.raise_for_status()
                    with open("gofile_file.zip", 'wb') as f:
                        for chunk in r.iter_content(chunk_size=8192):
                            f.write(chunk)
            except Exception as e:
                print(f"Gofile download failed: {e}")
        else:
            print("Could not extract a direct Gofile download link.")

        # --- 4. VALIDATION & UPLOAD LOGIC ---
        api_id = int(os.environ['TELEGRAM_API_ID'])
        api_hash = os.environ['TELEGRAM_API_HASH']
        bot_token = os.environ['TELEGRAM_BOT_TOKEN']
        chat_id = int(os.environ['TELEGRAM_CHAT_ID'])

        files_to_check = ['gdrive_file.zip', 'gofile_file.zip']
        files_to_upload = []

        # Validate files are actually large data files, not 2KB HTML error pages
        for file in files_to_check:
            if os.path.exists(file):
                size_mb = os.path.getsize(file) / (1024 * 1024)
                if size_mb > 1.0: # File must be larger than 1MB to be considered valid
                    files_to_upload.append(file)
                else:
                    print(f"WARNING: {file} is only {size_mb:.3f} MB. This is likely an HTML error page. Deleting.")
                    os.remove(file)

        async def upload_to_tg():
            if not files_to_upload:
                print("No valid files downloaded. Aborting Telegram upload.")
                return

            client = TelegramClient('bot_session', api_id, api_hash)
            await client.start(bot_token=bot_token)
            
            async with client:
                for file_path in files_to_upload:
                    print(f"Uploading {file_path} to Telegram... Please wait.")
                    await client.send_file(chat_id, file_path, caption=f"Pulled valid file asset: {file_path}")
                    print(f"Finished transferring {file_path}")

        if __name__ == '__main__':
            asyncio.run(upload_to_tg())
        EOF
        python run_task.py
