name: File Downloader & Telegram Uploader Menu

on:
  workflow_dispatch:
    inputs:
      gdrive_url:
        description: 'Enter Google Drive URL (Direct or Sharing Link)'
        required: true
        default: 'https://drive.google.com/uc?export=download&id=15Ki1eA9IKuoS1V24Y9NuqACkvDrQO-'
      gofile_url:
        description: 'Enter Gofile URL'
        required: true
        default: 'https://gofile.io/d/MXMoqn'

jobs:
  process-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests telethon

    - name: Process Downloads and Upload to Telegram
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GDRIVE_INPUT_URL: ${{ github.event.inputs.gdrive_url }}
        GOFILE_INPUT_URL: ${{ github.event.inputs.gofile_url }}
      run: |
        cat << 'EOF' > run_task.py
        import os
        import re
        import asyncio
        import requests
        from telethon import TelegramClient

        # 1. Parse Google Drive ID to handle both clean download links and generic share links
        gdrive_raw = os.environ.get('GDRIVE_INPUT_URL', '')
        file_id_match = re.search(r'(?:id=|/d/)([^/&#?]+)', gdrive_raw)
        
        if file_id_match:
            file_id = file_id_match.group(1)
            gdrive_download_url = f"https://docs.google.com/uc?export=download&id={file_id}"
        else:
            gdrive_download_url = gdrive_raw

        gofile_url = os.environ.get('GOFILE_INPUT_URL', '')

        print(f"Target GDrive Link: {gdrive_download_url}")
        print(f"Target Gofile Link: {gofile_url}")

        # 2. Download Execution
        def download_file(url, output_name):
            try:
                print(f"Downloading {output_name}...")
                with requests.get(url, stream=True, allow_redirects=True) as r:
                    r.raise_for_status()
                    with open(output_name, 'wb') as f:
                        for chunk in r.iter_content(chunk_size=8192):
                            f.write(chunk)
                print(f"Saved {output_name} successfully.")
                return True
            except Exception as e:
                print(f"Error downloading {output_name}: {e}")
                return False

        # Execute downloads
        download_file(gdrive_download_url, "gdrive_file.zip")
        download_file(gofile_url, "gofile_file.zip")

        # 3. Telegram Upload Execution
        api_id = int(os.environ['TELEGRAM_API_ID'])
        api_hash = os.environ['TELEGRAM_API_HASH']
        bot_token = os.environ['TELEGRAM_BOT_TOKEN']
        chat_id = int(os.environ['TELEGRAM_CHAT_ID'])

        files_to_upload = ['gdrive_file.zip', 'gofile_file.zip']

        async def upload_to_tg():
            async with TelegramClient('bot_session', api_id, api_hash).start(bot_token=bot_token) as client:
                for file_path in files_to_upload:
                    if os.path.exists(file_path) and os.path.getsize(file_path) > 0:
                        print(f"Uploading {file_path} to Telegram...")
                        await client.send_file(chat_id, file_path, caption=f"Pulled file: {file_path}")
                        print(f"Finished uploading {file_path}")
                    else:
                        print(f"File {file_path} is empty or missing. Skipping upload.")

        if __name__ == '__main__':
            asyncio.run(upload_to_tg())
        EOF
        python run_task.py
