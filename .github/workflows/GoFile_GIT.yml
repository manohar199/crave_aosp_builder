name: GoFile To Release

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: "GoFile URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Download & Upload
        env:
          GOFILE_URL: ${{ github.event.inputs.gofile_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python gofile_release.py
