name: Transfer GoFile to Telegram

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: 'GoFile URL to download (e.g., https://gofile.io/d/xyz)'
        required: true
      password:
        description: 'Password for the GoFile link (leave blank if none)'
        required: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Download file from GoFile
        run: |
          # Ensure your bash script is executable
          chmod +x gofile-get
          
          # Setup download folder
          mkdir -p ./downloads
          
          # Execute your script with or without a password
          if [ -z "${{ github.event.inputs.password }}" ]; then
            ./gofile-get "${{ github.event.inputs.gofile_url }}" -d ./downloads
          else
            ./gofile-get "${{ github.event.inputs.gofile_url }}" -p "${{ github.event.inputs.password }}" -d ./downloads
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        # cryptg is added to significantly boost Telethon's upload speeds
        run: pip install telethon cryptg 

      - name: Upload to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TARGET_PATH: ./downloads
        run: |
          python upload_to_telegram.py
