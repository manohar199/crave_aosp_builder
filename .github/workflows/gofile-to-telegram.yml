name: GoFile To Telegram

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: "GoFile URL"
        required: true
        type: string

jobs:
  download-and-send:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyrogram tgcrypto

      - name: Download from GoFile
        run: |
          mkdir -p downloads
          export GF_DOWNLOAD_DIR=downloads

          echo "Downloading from:"
          echo "${{ github.event.inputs.gofile_url }}"

          python gofile-downloader.py "${{ github.event.inputs.gofile_url }}"

      - name: Verify downloaded files
        run: |
          echo "========== DOWNLOADED FILES =========="
          find downloads -type f || true

          echo ""
          echo "========== DIRECTORY TREE =========="
          ls -R downloads || true

      - name: Upload files to Telegram
        run: |
          cat > send.py << 'EOF'
          import os
          from pyrogram import Client

          api_id = int(os.environ["TELEGRAM_API_ID"])
          api_hash = os.environ["TELEGRAM_API_HASH"]
          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          app = Client(
              "bot",
              api_id=api_id,
              api_hash=api_hash,
              bot_token=bot_token
          )

          uploaded = 0

          with app:
              for root, dirs, files in os.walk("downloads"):
                  for file in files:
                      path = os.path.join(root, file)

                      try:
                          print(f"Uploading: {path}")

                          app.send_document(
                              chat_id=chat_id,
                              document=path,
                              caption=file
                          )

                          uploaded += 1

                      except Exception as e:
                          print(f"Failed: {file} -> {e}")

          print(f"Uploaded {uploaded} file(s)")
          EOF

          python send.py

      - name: Upload logs on failure
        if: failure()
        run: |
          echo "Workflow failed."
          echo "Downloaded files:"
          find downloads -type f || true
