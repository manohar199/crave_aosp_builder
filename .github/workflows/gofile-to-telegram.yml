name: GoFile / Google Drive → Telegram Transfer

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: '🔗 GoFile URL (https://gofile.io/d/XXXXX) or Google Drive URL (https://drive.usercontent.google.com/download?id=... or https://drive.google.com/file/d/...)'
        required: true
        type: string
      caption:
        description: '💬 Optional message caption'
        required: false
        default: 'File transferred via GitHub Actions'
      gofile_password:
        description: '🔒 GoFile folder password (only for GoFile links, leave blank if none)'
        required: false
        default: ''

jobs:
  transfer:
    name: 📦 Download & Send to Telegram
    runs-on: ubuntu-latest

    steps:
      # ── 1. Install dependencies ─────────────────────────────────────────────
      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl wget

      # ── 2. Detect URL type ──────────────────────────────────────────────────
      - name: Detect URL Type
        id: detect
        run: |
          URL="${{ github.event.inputs.file_url }}"
          echo "Input URL: $URL"

          if [[ "$URL" =~ gofile\.io/d/([a-zA-Z0-9]+) ]]; then
            echo "url_type=gofile" >> "$GITHUB_OUTPUT"
            echo "content_id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "✅ Detected: GoFile URL — Content ID: ${BASH_REMATCH[1]}"

          elif [[ "$URL" =~ drive\.usercontent\.google\.com/download\?id=([a-zA-Z0-9_-]+) ]]; then
            echo "url_type=gdrive_direct" >> "$GITHUB_OUTPUT"
            echo "file_id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "✅ Detected: Google Drive direct download URL — File ID: ${BASH_REMATCH[1]}"

          elif [[ "$URL" =~ drive\.google\.com/file/d/([a-zA-Z0-9_-]+) ]]; then
            echo "url_type=gdrive_share" >> "$GITHUB_OUTPUT"
            echo "file_id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "✅ Detected: Google Drive share URL — File ID: ${BASH_REMATCH[1]}"

          elif [[ "$URL" =~ drive\.google\.com.*[?&]id=([a-zA-Z0-9_-]+) ]]; then
            echo "url_type=gdrive_share" >> "$GITHUB_OUTPUT"
            echo "file_id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "✅ Detected: Google Drive legacy URL — File ID: ${BASH_REMATCH[1]}"

          else
            echo "❌ Unsupported URL format."
            echo "   Supported formats:"
            echo "     • https://gofile.io/d/XXXXXXX"
            echo "     • https://drive.usercontent.google.com/download?id=XXXX&export=download"
            echo "     • https://drive.google.com/file/d/XXXX/view"
            exit 1
          fi

      # ════════════════════════════════════════════════════════════════════════
      #  GOFILE BRANCH
      # ════════════════════════════════════════════════════════════════════════

      - name: "[GoFile] Get Guest Token"
        id: gf_token
        if: steps.detect.outputs.url_type == 'gofile'
        run: |
          echo "🔑 Fetching GoFile guest token..."
          RESPONSE=$(curl -s -X POST "https://api.gofile.io/accounts" \
            -H "Content-Type: application/json")
          STATUS=$(echo "$RESPONSE" | jq -r '.status')
          if [[ "$STATUS" != "ok" ]]; then
            echo "❌ Failed to get guest token"
            echo "$RESPONSE"
            exit 1
          fi
          TOKEN=$(echo "$RESPONSE" | jq -r '.data.token')
          echo "guest_token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "✅ Guest token obtained"

      - name: "[GoFile] Fetch Content Info"
        id: gf_content
        if: steps.detect.outputs.url_type == 'gofile'
        env:
          CONTENT_ID: ${{ steps.detect.outputs.content_id }}
          GUEST_TOKEN: ${{ steps.gf_token.outputs.guest_token }}
          PASSWORD: ${{ github.event.inputs.gofile_password }}
        run: |
          echo "📂 Fetching content info for ID: $CONTENT_ID"
          API_URL="https://api.gofile.io/contents/$CONTENT_ID?wt=4fd6sg89d7s6&cache=true"
          if [[ -n "$PASSWORD" ]]; then
            PASS_HASH=$(echo -n "$PASSWORD" | sha256sum | awk '{print $1}')
            API_URL="${API_URL}&password=$PASS_HASH"
          fi
          RESPONSE=$(curl -s "$API_URL" -H "Authorization: Bearer $GUEST_TOKEN")
          STATUS=$(echo "$RESPONSE" | jq -r '.status')
          if [[ "$STATUS" != "ok" ]]; then
            echo "❌ Failed to fetch GoFile content"
            echo "$RESPONSE" | jq '.'
            exit 1
          fi
          echo "$RESPONSE" > /tmp/gofile_content.json
          TYPE=$(echo "$RESPONSE" | jq -r '.data.type')
          echo "✅ Content type: $TYPE"

      - name: "[GoFile] Download Files"
        id: gf_download
        if: steps.detect.outputs.url_type == 'gofile'
        env:
          GUEST_TOKEN: ${{ steps.gf_token.outputs.guest_token }}
        run: |
          mkdir -p /tmp/downloads

          TYPE=$(jq -r '.data.type' /tmp/gofile_content.json)

          if [[ "$TYPE" == "file" ]]; then
            jq -r '[.data | {name: .name, link: .link, size: .size}]' \
              /tmp/gofile_content.json > /tmp/file_list.json
          else
            jq '[.data.children[] | select(.type == "file") | {name: .name, link: .link, size: .size}]' \
              /tmp/gofile_content.json > /tmp/file_list.json
          fi

          FILE_COUNT=$(jq 'length' /tmp/file_list.json)
          echo "📋 Files found: $FILE_COUNT"

          if [[ "$FILE_COUNT" -eq 0 ]]; then
            echo "❌ No files found in GoFile link."
            exit 1
          fi

          for i in $(seq 0 $((FILE_COUNT - 1))); do
            NAME=$(jq -r ".[$i].name" /tmp/file_list.json)
            LINK=$(jq -r ".[$i].link" /tmp/file_list.json)
            SIZE=$(jq -r ".[$i].size" /tmp/file_list.json)
            echo "⬇️  [$((i+1))/$FILE_COUNT] $NAME ($SIZE bytes)"
            HTTP_STATUS=$(curl -L -s -o "/tmp/downloads/$NAME" -w "%{http_code}" \
              -H "Authorization: Bearer $GUEST_TOKEN" \
              -H "Cookie: accountToken=$GUEST_TOKEN" \
              "$LINK")
            if [[ "$HTTP_STATUS" == "200" ]]; then
              echo "   ✅ Downloaded"
            else
              echo "   ❌ Failed (HTTP $HTTP_STATUS)"
            fi
          done

          ls -lh /tmp/downloads/

      # ════════════════════════════════════════════════════════════════════════
      #  GOOGLE DRIVE BRANCH
      # ════════════════════════════════════════════════════════════════════════

      - name: "[GDrive] Download File"
        id: gd_download
        if: |
          steps.detect.outputs.url_type == 'gdrive_direct' ||
          steps.detect.outputs.url_type == 'gdrive_share'
        env:
          FILE_ID: ${{ steps.detect.outputs.file_id }}
        run: |
          mkdir -p /tmp/downloads
          echo "⬇️  Downloading Google Drive file ID: $FILE_ID"

          # Build the direct download URL
          DOWNLOAD_URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"

          # First request — may get a virus-scan warning page for large files
          HTTP_STATUS=$(curl -L -s -c /tmp/gdrive_cookies.txt \
            -o /tmp/gdrive_response.html \
            -w "%{http_code}" \
            -A "Mozilla/5.0 (X11; Linux x86_64)" \
            "$DOWNLOAD_URL")

          echo "Initial HTTP status: $HTTP_STATUS"

          # Check if Google returned a virus warning confirmation page
          if grep -q "confirm=" /tmp/gdrive_response.html 2>/dev/null; then
            echo "🔄 Large file detected — following confirmation..."
            CONFIRM=$(grep -o 'confirm=[a-zA-Z0-9_-]*' /tmp/gdrive_response.html | head -1 | cut -d= -f2)
            UUID=$(grep -o 'uuid=[a-zA-Z0-9_-]*' /tmp/gdrive_response.html | head -1 | cut -d= -f2 || echo "")

            CONFIRM_URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=${CONFIRM}"
            [[ -n "$UUID" ]] && CONFIRM_URL="${CONFIRM_URL}&uuid=${UUID}"

            HTTP_STATUS=$(curl -L -s -b /tmp/gdrive_cookies.txt \
              -o /tmp/gdrive_response2.bin \
              -w "%{http_code}" \
              -A "Mozilla/5.0 (X11; Linux x86_64)" \
              "$CONFIRM_URL")

            echo "Confirmation HTTP status: $HTTP_STATUS"
            FINAL_FILE="/tmp/gdrive_response2.bin"
          else
            FINAL_FILE="/tmp/gdrive_response.html"
          fi

          # Try to extract filename from Content-Disposition header
          FILENAME=$(curl -L -s -I \
            -A "Mozilla/5.0 (X11; Linux x86_64)" \
            -b /tmp/gdrive_cookies.txt \
            "$DOWNLOAD_URL" \
            | grep -i "content-disposition" \
            | grep -o 'filename[^;]*' \
            | sed 's/filename[*]*=//;s/["'\'']//g;s/UTF-8//;s/^[[:space:]]*//' \
            | head -1)

          # Fallback filename
          if [[ -z "$FILENAME" ]]; then
            FILENAME="gdrive_${FILE_ID}"
            echo "⚠️  Could not detect filename, using: $FILENAME"
          else
            echo "📄 Detected filename: $FILENAME"
          fi

          # Move to downloads with real filename
          mv "$FINAL_FILE" "/tmp/downloads/$FILENAME"

          FILE_SIZE=$(stat -c%s "/tmp/downloads/$FILENAME")
          echo "✅ Downloaded: $FILENAME ($FILE_SIZE bytes)"
          ls -lh /tmp/downloads/

      # ════════════════════════════════════════════════════════════════════════
      #  SEND TO TELEGRAM (common for both sources)
      # ════════════════════════════════════════════════════════════════════════

      - name: Send Files to Telegram
        env:
          BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPTION:    ${{ github.event.inputs.caption }}
          SOURCE_URL: ${{ github.event.inputs.file_url }}
        run: |
          echo "📤 Sending files to Telegram..."

          REPO="${{ github.repository }}"
          ACTOR="${{ github.actor }}"
          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          URL_TYPE="${{ steps.detect.outputs.url_type }}"
          MAX_SIZE=$((50 * 1024 * 1024))   # 50 MB Telegram Bot API limit

          # Determine source label for caption
          if [[ "$URL_TYPE" == "gofile" ]]; then
            SOURCE_LABEL="📁 GoFile"
          else
            SOURCE_LABEL="☁️ Google Drive"
          fi

          FILES=(/tmp/downloads/*)
          TOTAL=${#FILES[@]}
          SUCCESS=0
          FAIL=0
          SKIPPED=0

          for FILE in "${FILES[@]}"; do
            [[ ! -f "$FILE" ]] && continue

            FILENAME=$(basename "$FILE")
            FILE_SIZE=$(stat -c%s "$FILE")

            echo ""
            echo "📤 Sending: $FILENAME ($FILE_SIZE bytes)"

            if (( FILE_SIZE > MAX_SIZE )); then
              echo "   ⚠️  Skipping — exceeds 50 MB Telegram limit"
              (( SKIPPED++ ))
              curl -s -o /dev/null \
                -d "chat_id=$CHAT_ID" \
                -d "text=$(printf '⚠️ *Skipped (>50MB)*\n📁 `%s`\n📏 %s bytes\n\nTelegram Bot API max is 50 MB.' "$FILENAME" "$FILE_SIZE")" \
                -d "parse_mode=Markdown" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendMessage"
              continue
            fi

            FILE_CAPTION=$(printf "%s *%s*\n\n📁 File: \`%s\`\n📏 Size: %s bytes\n🔗 Source: %s\n👤 Triggered by: %s\n\n💬 %s\n\n[🚀 View Run](%s)" \
              "$SOURCE_LABEL" "$REPO" "$FILENAME" "$FILE_SIZE" "$SOURCE_URL" "$ACTOR" "$CAPTION" "$RUN_URL")

            HTTP_STATUS=$(curl -s -o /tmp/tg_resp.json -w "%{http_code}" \
              -F "chat_id=$CHAT_ID" \
              -F "document=@$FILE" \
              -F "caption=$FILE_CAPTION" \
              -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument")

            if [[ "$HTTP_STATUS" == "200" ]]; then
              echo "   ✅ Sent"
              (( SUCCESS++ ))
            else
              echo "   ❌ Failed (HTTP $HTTP_STATUS)"
              cat /tmp/tg_resp.json
              (( FAIL++ ))
            fi

            sleep 1
          done

          echo ""
          echo "══════════════════════════════════"
          echo "  📊 Transfer Summary"
          echo "  ✅ Sent:    $SUCCESS / $TOTAL"
          echo "  ❌ Failed:  $FAIL"
          echo "  ⚠️  Skipped: $SKIPPED (>50 MB)"
          echo "══════════════════════════════════"

          SUMMARY=$(printf "✅ *Transfer Complete*\n\n%s\n📦 Repo: \`%s\`\n🔗 Source: %s\n👤 By: %s\n\n📊 Results:\n• ✅ Sent: %s\n• ❌ Failed: %s\n• ⚠️ Skipped: %s\n\n[🚀 View Run](%s)" \
            "$SOURCE_LABEL" "$REPO" "$SOURCE_URL" "$ACTOR" "$SUCCESS" "$FAIL" "$SKIPPED" "$RUN_URL")

          curl -s -o /dev/null \
            -d "chat_id=$CHAT_ID" \
            -d "text=$SUMMARY" \
            -d "parse_mode=Markdown" \
            "https://api.telegram.org/bot$BOT_TOKEN/sendMessage"

          if (( FAIL > 0 )); then
            echo "❌ Some files failed to send."
            exit 1
          fi
