- name: "[GDrive] Download File"
        id: gd_download
        if: |
          steps.detect.outputs.url_type == 'gdrive_direct' ||
          steps.detect.outputs.url_type == 'gdrive_share'
        env:
          FILE_ID: ${{ steps.detect.outputs.file_id }}
        run: |
          mkdir -p /tmp/downloads
          echo "⬇️  Downloading Google Drive file ID: $FILE_ID"

          DOWNLOAD_URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"

          # Step 1: initial request (catches virus-scan confirmation page for large files)
          HTTP_STATUS=$(curl -L -s -c /tmp/gdrive_cookies.txt \
            -D /tmp/gdrive_headers.txt \
            -o /tmp/gdrive_initial.bin \
            -w "%{http_code}" \
            -A "Mozilla/5.0 (X11; Linux x86_64)" \
            "$DOWNLOAD_URL")

          echo "Initial HTTP status: $HTTP_STATUS"

          # Step 2: if Google returned a confirmation HTML page instead of the stream, follow it
          if grep -q "confirm=" /tmp/gdrive_initial.bin 2>/dev/null; then
            echo "🔄 Large file — following Google confirmation..."

            CONFIRM=$(grep -oP 'confirm=\K[a-zA-Z0-9_-]+' /tmp/gdrive_initial.bin | head -1)
            UUID=$(grep -oP 'uuid=\K[a-zA-Z0-9_-]+' /tmp/gdrive_initial.bin | head -1 || true)

            CONFIRM_URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=${CONFIRM}"
            [[ -n "$UUID" ]] && CONFIRM_URL="${CONFIRM_URL}&uuid=${UUID}"

            HTTP_STATUS=$(curl -L -s -b /tmp/gdrive_cookies.txt \
              -D /tmp/gdrive_headers.txt \
              -o /tmp/gdrive_file.bin \
              -w "%{http_code}" \
              -A "Mozilla/5.0 (X11; Linux x86_64)" \
              "$CONFIRM_URL")

            echo "Confirmation HTTP status: $HTTP_STATUS"
            FINAL_FILE="/tmp/gdrive_file.bin"
          else
            FINAL_FILE="/tmp/gdrive_initial.bin"
          fi

          # Step 3: detect filename using safe, non-nested string extraction
          RAW_DISPOSITION=$(grep -i "content-disposition" /tmp/gdrive_headers.txt | head -1)
          if [[ "$RAW_DISPOSITION" =~ filename\*?=[^\'\"]*[\'\"]*([^\"\'\r\n;]+) ]]; then
            FILENAME="${BASH_REMATCH[1]}"
          elif [[ "$RAW_DISPOSITION" =~ filename=([^\"\'\r\n;]+) ]]; then
            FILENAME="${BASH_REMATCH[1]}"
          else
            FILENAME=""
          fi

          if [[ -z "$FILENAME" ]]; then
            FILENAME="gdrive_${FILE_ID}.bin"
            echo "⚠️  Could not detect filename, using: $FILENAME"
          else
            echo "📄 Detected filename: $FILENAME"
          fi

          mv "$FINAL_FILE" "/tmp/downloads/$FILENAME"

          FILE_SIZE=$(stat -c%s "/tmp/downloads/$FILENAME")
          echo "✅ Downloaded: $FILENAME ($FILE_SIZE bytes)"
          ls -lh /tmp/downloads/
