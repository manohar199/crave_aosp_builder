name: Send Release to Telegram

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to send'
        required: true
        type: choice
        default: 'latest'
        options:
          - 'latest'
          # Add each new tag here as you cut releases, newest on top
          - '27287401044'
          # - 'v1.2.0'
          # - 'v1.1.0'

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        # Includes pyrogram and tgcrypto for fast, large file uploads
        run: pip install requests pyrogram tgcrypto

      - name: Run Python script
        env:
          # Your standard bot credentials
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          
          # Your new MTProto API credentials for 2GB uploads
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          
          # Uses the tag picked from the dropdown (treating 'latest' as "no tag"),
          # otherwise falls back to the tag from an automatic "release published" trigger
          RELEASE_TAG: ${{ (github.event.inputs.release_tag != 'latest' && github.event.inputs.release_tag) || github.event.release.tag_name }}
          
        run: python send_release.py
