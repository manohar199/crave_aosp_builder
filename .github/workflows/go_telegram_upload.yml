name: Upload Direct URL to Telegram

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct Download URL (e.g., https://storeX.gofile.io/...)'
        required: true

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5 # Updated to v5 to fix Node.js warnings
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyrogram tgcrypto

      - name: Create Python Script
        run: |
          cat << 'EOF' > upload.py
          import os
          import requests
          import urllib.parse
          import re
          from pyrogram import Client

          URL = os.environ.get("FILE_URL")
          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          CHAT_ID = int(os.environ.get("TELEGRAM_CHAT_ID"))
          API_ID = int(os.environ.get("TELEGRAM_API_ID"))
          API_HASH = os.environ.get("TELEGRAM_API_HASH")

          print(f"Starting download from: {URL}")
          
          local_filename = "downloaded_file"
          
          # Headers to bypass basic hotlink protections
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
              "Referer": "https://gofile.io/"
          }
          
          with requests.get(URL, headers=headers, stream=True) as r:
              r.raise_for_status()
              if "content-disposition" in r.headers:
                  d = r.headers['content-disposition']
                  fname = re.findall("filename=(.+)", d)
                  if len(fname) > 0:
                      local_filename = fname[0].strip('"').strip("'")
              else:
                  parsed_url = urllib.parse.urlparse(URL)
                  url_filename = os.path.basename(parsed_url.path)
                  if url_filename:
                      local_filename = urllib.parse.unquote(url_filename)

              with open(local_filename, 'wb') as f:
                  for chunk in r.iter_content(chunk_size=8192):
                      f.write(chunk)
                      
          print(f"Download complete: {local_filename}")

          app = Client("telegram_bot", api_id=API_ID, api_hash=API_HASH, bot_token=BOT_TOKEN)

          with app:
              print(f"Uploading to Telegram...")
              app.send_document(chat_id=CHAT_ID, document=local_filename)
              
          print("Upload successful!")
          EOF

      - name: Execute Python Script
        env:
          FILE_URL: ${{ github.event.inputs.file_url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python upload.py
